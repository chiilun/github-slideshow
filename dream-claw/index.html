<body>
<header class="header"><div class="brand"><span>✳</span> 抓夢所 <small>DREAM CLAW</small></div><nav><button id="sound" aria-label="開啟音效">♪ <span>音效關</span></button><button data-open="scratch">刮刮樂 <b id="nav-scratch">0</b></button><button data-open="tuning" aria-label="機台調整">⚙<span class="lbl"> 調整</span></button><button data-open="collection">收藏 <b id="nav-count">0</b></button></nav></header>
<main id="play">
<section class="stage" aria-label="3D 娃娃機">
<div class="machines" role="group" aria-label="選擇機台"><button class="selected" data-machine="plush">🧸 娃娃台</button><button data-machine="tissue">🧻 衛生紙台</button></div>
<div id="viewport" tabindex="0" aria-label="娃娃機視角"><div id="loading" aria-label="載入中"><i></i></div></div>
<div class="stage-tools"><div class="views" aria-label="切換視角"><button class="selected" data-view="angle">立體</button><button data-view="front">正面</button><button data-view="top">俯視</button></div><button id="reset-view" aria-label="重設視角">⌖</button><button id="refill" class="refill" aria-label="恢復檯面，重新擺好所有娃娃或衛生紙">↻ 恢復檯面</button></div>
</section>
<section class="controls" aria-label="娃娃機控制區">
<div class="control-top"><div class="mode-switch" aria-label="遊戲模式"><button class="selected" data-mode="relaxed">標準內丟</button><button data-mode="challenge">強內丟</button></div><span id="timer" aria-label="剩餘秒數">∞</span></div>
<div class="control-main"><div id="joystick" role="group" aria-label="拖曳圓盤控制爪子方向"><div class="wheel-ring"></div><div id="joystick-knob"><span></span></div></div><button id="grab"><span>下爪</span><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v11m-7 0 7-4 7 4M9 14l-4 9 6 5m12-14 4 9-6 5M16 15v12"/></svg></button></div>
</section>
</main>
<dialog id="tuning" class="tuning"><div class="dialog-header"><h2>機台調整</h2><button class="close" aria-label="關閉調整">×</button></div><p class="tune-note">目前模式：<b id="tune-mode"></b>。拉動後立即生效並自動儲存；切換模式會載入該模式的預設值。</p><div id="tune-list"></div><div class="tune-actions"><button id="tune-reset">恢復此模式預設</button><button class="dialog-play">開始玩</button></div></dialog>
<dialog id="scratch" class="scratch"><div class="dialog-header"><h2>刮刮樂</h2><button class="close" aria-label="關閉刮刮樂">×</button></div>
<div class="sc-board"><div class="sc-head"><ul class="sc-rules"><li>出貨後才能刮，刮中指定號碼才有中獎</li><li>用手指在黑點上刮開，刮開一半就會揭曉</li><li>每次只能刮一格，刮完再刮下一格</li></ul><div class="sc-title" id="sc-rule"></div></div>
<div class="sc-prizes" id="sc-prizes"></div>
<div id="sc-grid" role="group" aria-label="刮刮樂格子"></div></div>
<div class="sc-bar"><span>可刮 <b id="sc-credits">0</b> 次</span><span id="sc-left"></span></div>
<div id="sc-msg" role="status"></div>
<details class="sc-settings"><summary>台主設定</summary><label>每出貨 1 件送 <input id="sc-per" type="number" min="1" max="10" inputmode="numeric"> 刮</label><div class="sc-pool-head"><span>類型</span><span>獎品名稱</span><span>號碼數</span><span></span></div><div id="sc-pool"></div><div class="sc-pool-actions"><button id="sc-add">＋ 新增獎品</button><button id="sc-reset-pool">恢復預設獎品</button></div><p class="sc-pool-note">獎品名稱改了馬上生效；類型、號碼數、新增或刪除，按「換新板」後才會套用。</p></details>
<div class="tune-actions"><button id="sc-new">換新板</button><button class="dialog-play">回去夾</button></div>
<div id="sc-win" class="sc-win" hidden><div class="sc-win-card"><div id="sc-win-art"></div><p id="sc-win-text"></p><button id="sc-win-ok">收下獎品</button></div></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="collection"><div class="dialog-header"><h2>我的收藏</h2><button class="close" aria-label="關閉收藏">×</button></div><div class="session-stats"><span>下爪 <b id="attempts">0</b></span><span>入洞 <b id="wins">0</b></span><span>款式 <b id="rate">0/5</b></span></div><div id="collection-grid"></div></dialog>
<script>
(function(){function show(m){var l=document.getElementById('loading');if(l){l.style.cssText='display:grid;place-items:center;height:100%;padding:24px;text-align:center;font-size:13px;color:#8a3b2a';l.textContent='載入失敗：'+m;}}
window.addEventListener('error',function(e){show(e.message||'未知錯誤');});window.addEventListener('unhandledrejection',function(e){show(String(e.reason&&e.reason.message||e.reason));});})();
